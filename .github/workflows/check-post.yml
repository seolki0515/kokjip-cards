name: 게시물 검사

on:
  pull_request:
    paths: ["posts/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.0.0
      - name: 이미지·캡션 규칙 검사
        run: python scripts/check_post.py
